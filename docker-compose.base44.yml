services:
  app:
    image: node:24
    working_dir: /app
    ports:
      - "3000:3090"
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3080
      - BACKEND_PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=devMasterKey123
      - MEILI_NO_ANALYTICS=true
      - SEARCH=true
      - ALLOW_REGISTRATION=true
      - ALLOW_EMAIL_LOGIN=true
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=true
      - ALLOW_SOCIAL_LOGIN=false
      - SESSION_EXPIRY=1000 * 60 * 15
      - REFRESH_TOKEN_EXPIRY=(1000 * 60 * 60 * 24) * 7
      - JWT_SECRET=dev_jwt_secret_not_for_production_use_123456
      - JWT_REFRESH_SECRET=dev_jwt_refresh_secret_not_for_production_789
      - CREDS_KEY=f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
      - CREDS_IV=e2341419ec3dd3d19b13a1a87fafcbfb
      - DOMAIN_CLIENT=http://localhost:3090
      - DOMAIN_SERVER=http://localhost:3080
      - OPENAI_API_KEY=user_provided
      - ANTHROPIC_API_KEY=user_provided
      - GOOGLE_KEY=user_provided
      - ASSISTANTS_API_KEY=user_provided
      - VITE_ALLOWED_HOSTS=true
      - DEBUG_LOGGING=true
      - NO_INDEX=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["bash", "-c", "npm install && npx turbo run build --filter='!@librechat/frontend' && npx concurrently --kill-others 'npx nodemon --watch api --watch packages --ext js,mjs,cjs,json api/server/index.js' 'cd client && npx vite --host 0.0.0.0 --port 3090'"]
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    restart: always
    volumes:
      - mongo_data:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=devMasterKey123
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  mongo_data:
  meili_data:

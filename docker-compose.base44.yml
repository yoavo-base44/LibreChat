services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=dev-master-key-base44
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot service to install deps and build workspace packages
  setup:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nm-api:/app/api/node_modules
      - nm-client:/app/client/node_modules
      - nm-dp:/app/packages/data-provider/node_modules
      - nm-ds:/app/packages/data-schemas/node_modules
      - nm-api-pkg:/app/packages/api/node_modules
      - nm-client-pkg:/app/packages/client/node_modules
    command: >
      sh -c "
        apk add --no-cache python3 make g++ &&
        npm ci --no-audit &&
        npm run build:packages
      "

  api:
    image: node:24-alpine
    working_dir: /app
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nm-api:/app/api/node_modules
      - nm-client:/app/client/node_modules
      - nm-dp:/app/packages/data-provider/node_modules
      - nm-ds:/app/packages/data-schemas/node_modules
      - nm-api-pkg:/app/packages/api/node_modules
      - nm-client-pkg:/app/packages/client/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=dev-master-key-base44
      - DOMAIN_CLIENT=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DOMAIN_SERVER=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - ALLOW_REGISTRATION=true
      - ALLOW_EMAIL_LOGIN=true
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=true
      - CREDS_KEY=f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
      - CREDS_IV=e2341419ec3dd3d19b13a1a87fafcbfb
      - JWT_SECRET=16f8c0ef4a5d391b26034086c628469d3f9f497f08163ab9b40137092f2909ef
      - JWT_REFRESH_SECRET=eaa5191f2914e30b9387fd84e254e4ba6fc51b4654968a9b0803b456a54b8418
      - SESSION_EXPIRY=1000 * 60 * 15
      - REFRESH_TOKEN_EXPIRY=(1000 * 60 * 60 * 24) * 7
      - OPENAI_API_KEY=user_provided
      - ANTHROPIC_API_KEY=user_provided
      - GOOGLE_KEY=user_provided
      - ASSISTANTS_API_KEY=user_provided
      - SESSION_COOKIE_SECURE=false
      - SEARCH=true
    command: npx nodemon api/server/index.js
    restart: unless-stopped

  client:
    image: node:24-alpine
    working_dir: /app/client
    ports:
      - "3000:3090"
    depends_on:
      api:
        condition: service_started
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nm-api:/app/api/node_modules
      - nm-client:/app/client/node_modules
      - nm-dp:/app/packages/data-provider/node_modules
      - nm-ds:/app/packages/data-schemas/node_modules
      - nm-api-pkg:/app/packages/api/node_modules
      - nm-client-pkg:/app/packages/client/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3090
      - BACKEND_PORT=3080
      # HOST is used by vite.config.ts for both server.host AND proxy target.
      # We override the proxy target to point at the api container via
      # vite.config.ts's backendURL logic: http://${HOST}:${BACKEND_PORT}
      # So we set HOST to the api service name.
      - HOST=api
      - VITE_ALLOWED_HOSTS=*
    command: npx vite --host 0.0.0.0 --port 3090
    restart: unless-stopped

volumes:
  mongo-data:
  meili-data:
  node_modules:
  nm-api:
  nm-client:
  nm-dp:
  nm-ds:
  nm-api-pkg:
  nm-client-pkg:
